name: Bug
description: Algo no funciona como deberia
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Que pasa
      description: Que esperabas y que ocurrio en su lugar.
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Como reproducirlo
      placeholder: |
        1. Ejecuto /bet en un proyecto sin .crew/
        2. ...
    validations:
      required: true
  - type: dropdown
    id: zona
    attributes:
      label: Que parte falla
      options:
        - Un agente (responde mal o fuera de su rol)
        - Un comando (/crew, /bet, /hill, /ship)
        - Los hooks (aviso al abrir sesion o al cerrar)
        - Instalacion del plugin
        - Documentacion
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Sistema operativo y version de Claude Code
      placeholder: "Windows 11 · claude 2.1.150"
    validations:
      required: true
  - type: textarea
    id: salida
    attributes:
      label: Salida relevante
      description: Si es un hook, pega lo que imprime. Se formatea como shell automaticamente.
      render: shell
